# Checks that live checkout works: after every deploy to main, every 6 hours, and on
# demand (Actions tab -> Payments health -> Run workflow). A failed run makes GitHub
# email the repo owner, so a broken Polar setup is caught before customers hit it.
name: Payments health

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render to deploy this commit
        if: github.event_name == 'push'
        run: sleep 420

      - name: Check /api/health/payments
        run: |
          url=https://pricepilot-api-cfl6.onrender.com/api/health/payments
          # Retries cover a free-tier cold start or a deploy that is still finishing.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -m 60 -o body.json -w '%{http_code}' "$url" || echo 000)
            echo "Attempt $attempt: HTTP $code"; cat body.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 60
          done
          echo "::error::Live checkout is broken. The response above says why (usually POLAR_MODE, POLAR_ACCESS_TOKEN or a POLAR_PRODUCT_* value in Render)."
          exit 1
