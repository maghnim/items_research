# Render's free plan puts the API to sleep after 15 minutes without requests, and the
# next visitor then waits ~40 seconds for it to start (checkout links feel broken).
# Pinging /api/health every 5 minutes keeps it awake. A paid Render instance never
# sleeps; delete this workflow if you upgrade.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 90 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' https://pricepilot-api-cfl6.onrender.com/api/health
