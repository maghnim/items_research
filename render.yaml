services:
  # Backend API — Node/Express, free web service.
  - type: web
    name: pricepilot-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Skips downloading Chromium during install to fit the free tier's build/disk limits.
      # The headless-browser fallback in services/scraper.js is skipped if this is set;
      # cheerio-based scraping (the majority of sites) still works normally.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_URL
        value: https://pricepilot-app.onrender.com
      - key: API_URL
        value: https://pricepilot-api.onrender.com
      # Fill these in from the Render dashboard after the service is created
      # (kept out of this file so secrets never get committed to git).
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_PLAN_STARTER
        sync: false
      - key: PAYPAL_PLAN_GROWTH
        sync: false
      - key: PAYPAL_PLAN_PRO
        sync: false
      - key: PAYPAL_PLAN_AGENCY
        sync: false

  # Frontend — static site, always free on Render.
  - type: web
    name: pricepilot-app
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
