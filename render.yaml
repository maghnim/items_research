services:
  # Backend API — Node/Express, free web service.
  - type: web
    name: pricepilot-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Skips downloading Chromium during install to fit the free tier's build/disk limits.
      # The headless-browser fallback in services/scraper.js is skipped if this is set;
      # cheerio-based scraping (the majority of sites) still works normally.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_URL
        value: https://pricera.online
      - key: API_URL
        value: https://pricepilot-api-cfl6.onrender.com
      # Fill these in from the Render dashboard after the service is created
      # (kept out of this file so secrets never get committed to git).
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # One-time (non-recurring) Prices for the two trial options (24h / 7d).
      # Required at signup — checkout fails with no trial price configured until these are set.
      - key: STRIPE_PRICE_TRIAL_24H
        sync: false
      - key: STRIPE_PRICE_TRIAL_7D
        sync: false
      # 4 categories (standard/premium/premiumplus/vip) x 4 billing terms (1/3/6/12 months)
      # = 16 Stripe Prices, all EUR. See backend/.env.example for the full list of keys.
      - key: STRIPE_PRICE_STANDARD_1
        sync: false
      - key: STRIPE_PRICE_STANDARD_3
        sync: false
      - key: STRIPE_PRICE_STANDARD_6
        sync: false
      - key: STRIPE_PRICE_STANDARD_12
        sync: false
      - key: STRIPE_PRICE_PREMIUM_1
        sync: false
      - key: STRIPE_PRICE_PREMIUM_3
        sync: false
      - key: STRIPE_PRICE_PREMIUM_6
        sync: false
      - key: STRIPE_PRICE_PREMIUM_12
        sync: false
      - key: STRIPE_PRICE_PREMIUMPLUS_1
        sync: false
      - key: STRIPE_PRICE_PREMIUMPLUS_3
        sync: false
      - key: STRIPE_PRICE_PREMIUMPLUS_6
        sync: false
      - key: STRIPE_PRICE_PREMIUMPLUS_12
        sync: false
      - key: STRIPE_PRICE_VIP_1
        sync: false
      - key: STRIPE_PRICE_VIP_3
        sync: false
      - key: STRIPE_PRICE_VIP_6
        sync: false
      - key: STRIPE_PRICE_VIP_12
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      # ID of the webhook registered in the PayPal Developer Dashboard, used to verify
      # that incoming /api/webhooks/paypal requests actually came from PayPal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Same 16 combos as PayPal Billing Plans.
      - key: PAYPAL_PLAN_STANDARD_1
        sync: false
      - key: PAYPAL_PLAN_STANDARD_3
        sync: false
      - key: PAYPAL_PLAN_STANDARD_6
        sync: false
      - key: PAYPAL_PLAN_STANDARD_12
        sync: false
      - key: PAYPAL_PLAN_PREMIUM_1
        sync: false
      - key: PAYPAL_PLAN_PREMIUM_3
        sync: false
      - key: PAYPAL_PLAN_PREMIUM_6
        sync: false
      - key: PAYPAL_PLAN_PREMIUM_12
        sync: false
      - key: PAYPAL_PLAN_PREMIUMPLUS_1
        sync: false
      - key: PAYPAL_PLAN_PREMIUMPLUS_3
        sync: false
      - key: PAYPAL_PLAN_PREMIUMPLUS_6
        sync: false
      - key: PAYPAL_PLAN_PREMIUMPLUS_12
        sync: false
      - key: PAYPAL_PLAN_VIP_1
        sync: false
      - key: PAYPAL_PLAN_VIP_3
        sync: false
      - key: PAYPAL_PLAN_VIP_6
        sync: false
      - key: PAYPAL_PLAN_VIP_12
        sync: false
      # Polar.sh organization access token (scope: checkouts:write).
      - key: POLAR_ACCESS_TOKEN
        sync: false

  # Frontend — static site, always free on Render.
  - type: web
    name: pricepilot-app
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
