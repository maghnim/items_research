<title data-i18n="meta.checkout.title">Checkout — Pricera</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/style.css" />

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">P</span> Pricera</a>
    <div class="header-actions">
      <div class="lang-switch">
        <button data-lang-switch="en">EN</button>
        <button data-lang-switch="fr">FR</button>
      </div>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="checkout.title">Checkout</h1>
    <p class="sub" id="checkout-status" data-i18n="checkout.loading">Taking you to secure checkout…</p>

    <div class="form-msg" id="form-msg"></div>

    <p id="checkout-back" class="auth-switch" style="display:none;" data-i18n="checkout.back.html" data-i18n-html>
      <a href="pricing.html">See all plans</a>
    </p>
  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/checkout.js"></script>
