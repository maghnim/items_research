<title data-i18n="meta.checkout.title">Preparing your order — Pricera</title>
<meta charset="UTF-8" />
<script>
  // Fast path: a plan link opened by a visitor who isn't logged in goes straight to the
  // API (GET /billing/polar/go), which creates the Polar checkout and redirects there,
  // before anything else on this page loads. js/checkout.js handles everything else
  // (trials, Stripe, logged-in buyers) and shows errors, which come back with direct=0.
  (function () {
    var params = new URLSearchParams(location.search);
    var token = null;
    var lang = null;
    try { token = localStorage.getItem('pp_token'); lang = localStorage.getItem('pp_lang'); } catch (e) {}
    if (!params.get('months') || params.get('trial') || params.get('provider') === 'stripe' || params.get('direct') === '0' || token) return;
    // Same API host as js/api.js.
    var api = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
      ? 'http://localhost:4000/api'
      : 'https://pricepilot-api-cfl6.onrender.com/api';
    params.set('locale', lang || ((navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'));
    window.checkoutRedirecting = true;
    location.replace(api + '/billing/polar/go?' + params.toString());
  })();
</script>
<link rel="preconnect" href="https://pricepilot-api-cfl6.onrender.com" crossorigin />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/style.css" />

<style>
  .checkout-wait { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .checkout-wait-box { text-align: center; max-width: 420px; }
  .checkout-spinner {
    width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
    border: 4px solid var(--blue-50, #eff6ff); border-top-color: var(--blue-700, #1d4ed8);
    animation: checkout-spin 0.8s linear infinite;
  }
  @keyframes checkout-spin { to { transform: rotate(360deg); } }
  .checkout-wait-text { font-size: 18px; font-weight: 600; color: var(--navy-900, #0f172a); margin: 0; }
  .checkout-wait .form-msg { margin-top: 16px; }
</style>

<div class="checkout-wait">
  <div class="checkout-wait-box">
    <div class="checkout-spinner" id="checkout-spinner"></div>
    <p class="checkout-wait-text" id="checkout-status" data-i18n="checkout.loading">Preparing your order…</p>

    <div class="form-msg" id="form-msg"></div>

    <p id="checkout-back" class="auth-switch" style="display:none;" data-i18n="checkout.back.html" data-i18n-html>
      <a href="pricing.html">See all plans</a>
    </p>
  </div>
</div>
<script>
  // Shown during the fast-path redirect, before translations.js loads: pick the language now.
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('pp_lang'); } catch (e) {}
    if ((lang || navigator.language || '').toLowerCase().indexOf('fr') === 0) {
      document.getElementById('checkout-status').textContent = 'Préparation de votre commande…';
      document.title = 'Préparation de votre commande — Pricera';
    }
  })();
</script>

<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/checkout.js"></script>
