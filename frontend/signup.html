<title data-i18n="meta.signup.title">Start your trial — PricePilot</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">P</span> PricePilot</a>
    <div class="header-actions">
      <div class="lang-switch">
        <button data-lang-switch="en">EN</button>
        <button data-lang-switch="fr">FR</button>
      </div>
      <span style="font-size:14px;color:#64748b;" data-i18n="signup.header.hasaccount">Already have an account?</span>
      <a href="login.html" class="btn btn-outline" data-i18n="signup.header.login">Log in</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="signup.title">Start your trial</h1>
    <p class="sub" data-i18n="signup.subtitle">14-day trial, unlocked with a one-time payment of €2.99. No auto-renewal.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="signup-form">
      <div class="field">
        <label for="email" data-i18n="signup.email.label">Work email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="password" data-i18n="signup.password.label">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="signup.submit">Create account</button>
    </form>

    <p class="auth-switch" data-i18n="signup.switch.html" data-i18n-html>Already tracking prices with us? <a href="login.html">Log in</a></p>
    <p style="font-size:12.5px;color:#94a3b8;text-align:center;margin-top:18px;" data-i18n="signup.terms.html" data-i18n-html>
      By signing up you agree to our <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>.
    </p>
  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/billing.js"></script>
<script src="js/auth.js"></script>
