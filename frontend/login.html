<title data-i18n="meta.login.title">Log in — Pricera</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">P</span> Pricera</a>
    <div class="header-actions">
      <div class="lang-switch">
        <button data-lang-switch="en">EN</button>
        <button data-lang-switch="fr">FR</button>
      </div>
      <span style="font-size:14px;color:#64748b;" data-i18n="login.header.noaccount">Don't have an account?</span>
      <a href="signup.html" class="btn btn-primary" data-i18n="login.header.signup">Sign up</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="login.title">Welcome back</h1>
    <p class="sub" data-i18n="login.subtitle">Log in to your Pricera dashboard.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email" data-i18n="login.email.label">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password.label">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Sign in</button>
    </form>

    <p class="auth-switch" data-i18n="login.switch.html" data-i18n-html>New to Pricera? <a href="signup.html">Start your trial</a></p>
  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
