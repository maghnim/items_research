<title>Log in — PricePilot</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">P</span> PricePilot</a>
    <div class="header-actions">
      <span style="font-size:14px;color:#64748b;">Don't have an account?</span>
      <a href="signup.html" class="btn btn-primary">Sign up</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your PricePilot dashboard.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-switch">New to PricePilot? <a href="signup.html">Start your free trial</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
