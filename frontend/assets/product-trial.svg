<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- decorative grid dots -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="80" cy="80" r="3"/><circle cx="140" cy="80" r="3"/><circle cx="200" cy="80" r="3"/>
    <circle cx="80" cy="140" r="3"/><circle cx="140" cy="140" r="3"/><circle cx="200" cy="140" r="3"/>
    <circle cx="1000" cy="560" r="3"/><circle cx="1060" cy="560" r="3"/><circle cx="1120" cy="560" r="3"/>
    <circle cx="1000" cy="600" r="3"/><circle cx="1060" cy="600" r="3"/><circle cx="1120" cy="600" r="3"/>
  </g>

  <!-- price-trend line motif -->
  <polyline points="780,470 860,430 920,460 1000,360 1080,400 1140,300"
            fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1140" cy="300" r="7" fill="#60a5fa"/>

  <!-- logo mark -->
  <rect x="120" y="240" width="120" height="120" rx="28" fill="url(#markGrad)"/>
  <text x="180" y="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>

  <!-- wordmark -->
  <text x="270" y="320" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#ffffff">Pricera</text>

  <!-- tagline -->
  <text x="120" y="410" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" fill="#cbd5e1">Trial Access</text>
  <text x="120" y="450" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8">Track competitor prices &amp; stock — start in minutes</text>
</svg>
